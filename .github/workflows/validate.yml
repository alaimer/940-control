name: validate
# فحص بلا أسرار: يعمل على كل push وpull request. لا يوقّع ولا ينشر.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/scan-secrets.js
      - run: node scripts/validate.js
      - run: node --test tests/
