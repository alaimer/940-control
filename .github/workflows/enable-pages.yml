# مؤقت: يُشغَّل مرة واحدة يدويًا لتفعيل Pages من فرع gh-pages، ثم يُحذف من المستودع.
name: enable-pages (مؤقت)
on: workflow_dispatch
permissions:
  contents: read
  pages: write
jobs:
  enable:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages -f 'source[branch]=gh-pages' -f 'source[path]=/' || \
          gh api -X PUT repos/${{ github.repository }}/pages -f 'source[branch]=gh-pages' -f 'source[path]=/'
